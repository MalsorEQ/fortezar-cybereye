name: Stage npm release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  stage:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Use an npm CLI with staged publishing support
        run: npm install --global npm@11.15.0

      - name: Verify tag matches package version
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$expected" != "${{ github.event.release.tag_name }}" ]; then
            echo "Release tag ${{ github.event.release.tag_name }} does not match package version $expected" >&2
            exit 1
          fi

      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm pack --dry-run

      - name: Check whether the npm package already exists
        id: package
        shell: bash
        run: |
          if npm view fortezar-cybereye name --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Package is not on npm yet; skipping automated staging for the first publication."
          fi

      - name: Stage package for 2FA-approved publication
        if: steps.package.outputs.exists == 'true'
        run: npm stage publish
