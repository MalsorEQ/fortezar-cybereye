name: ForteZar CyberEye
description: Passive web-security checks with text, JSON, or SARIF output
author: ForteZar CyberEye contributors
branding:
  icon: eye
  color: blue
inputs:
  target:
    description: Full http(s) URL to scan
    required: true
  format:
    description: text, json, or sarif
    required: false
    default: sarif
  output:
    description: Optional report path
    required: false
    default: cybereye.sarif
  timeout:
    description: Request timeout in milliseconds
    required: false
    default: '10000'
outputs:
  exit-code:
    description: CyberEye process exit code
    value: ${{ steps.scan.outputs.exit-code }}
  report-path:
    description: Path supplied to the output input
    value: ${{ inputs.output }}
runs:
  using: composite
  steps:
    - id: scan
      shell: bash
      run: |
        set +e
        node "$GITHUB_ACTION_PATH/bin/cybereye.js" \
          "${{ inputs.target }}" \
          --format "${{ inputs.format }}" \
          --timeout "${{ inputs.timeout }}" \
          --output "${{ inputs.output }}"
        code=$?
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        exit "$code"
